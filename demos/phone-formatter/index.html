<!doctype html>
<html lang="en">
  <head>
    <script src="index.js" type="module"></script>
    <link rel="stylesheet" href="style.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1"><title>Phone number formatter</title><meta name="lyre-marketplace-demo" content="phone-formatter"><link rel="stylesheet" href="lyre.css"><script src="lyre.js" type="module"></script></head>
  <body><header class="lyre-heading"><h1>Phone number formatter</h1><p>Format a ten-digit phone number and show incomplete-input feedback.</p><p>Fixed demonstration format; no calling, country lookup or telecom validation.</p></header><div class="lyre-status" role="status"></div>
    <main class="container text-center">
      <h1 class="sr-only">Phone Number Formatter</h1>
      <div class="form-container">
        <div class="form-group">
          <label for="phone">Phone Number</label>
          <div class="input-wrapper">
            <input
              type="tel"
              id="phone"
              name="phone"
              inputmode="tel"
              autocomplete="off"
              maxlength="16"
              placeholder="+(123) 456-7890"
              aria-describedby="phone-format"
              aria-invalid="false"
              required
              autofocus
            />
            <span class="input-suffix">&#128222;</span>
          </div>
          <div id="phone-format" class="hint">
            Enter a 10-digit phone number. Format: +(123) 456-7890
          </div>
          <div id="phone-error" class="error-message" role="alert" aria-live="polite"></div>
        </div>
      </div>
    </main>
  </body>
</html>
