<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="lyre-marketplace-demo" content="drawing-app"><link rel="stylesheet" href="style.css"><title>Drawing pad</title></head><body><main><h1>Drawing pad</h1><p>Draw with a mouse, pen or finger. Save a PNG to keep a copy; this canvas is not autosaved.</p><div class="toolbox" aria-label="Drawing tools"><button id="decrease" aria-label="Decrease pen size">−</button><output id="size" aria-live="polite">10</output><button id="increase" aria-label="Increase pen size">+</button><label>Pen color <input type="color" id="color" value="#263c55"></label><button id="save">Save PNG</button><button id="clear">Clear canvas</button></div><canvas id="canvas" width="800" height="700" aria-label="Drawing canvas"></canvas><p id="status" role="status" aria-live="polite"></p></main><dialog id="clear-dialog" aria-labelledby="clear-title"><h2 id="clear-title">Clear this drawing?</h2><p>Save a PNG first if you want to keep it.</p><div class="dialog-actions"><button id="cancel-clear" type="button" autofocus>Cancel</button><button id="confirm-clear" type="button">Clear drawing</button></div></dialog><script src="script.js"></script></body></html>
