<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    
    <link rel="stylesheet" href="style.css" />
    
  <meta name="viewport" content="width=device-width, initial-scale=1"><title>Water tracker</title><meta name="lyre-marketplace-demo" content="water-tracker"><link rel="stylesheet" href="lyre.css"><script src="lyre.js" type="module"></script></head>
  <body><header class="lyre-heading"><h1>Water tracker</h1><p>Mark 250 ml glasses and see progress against a sample two-liter goal.</p><p>Session-only; edit the sample goal in the source.</p></header><div class="lyre-status" role="status"></div>
    <h1>Drink Water</h1>
    <h3>Sample goal: 2 liters</h3>

    <div class="cup">
      <div class="remained" id="remained">
        <span id="liters"></span>
        <small>Remained</small>
      </div>

      <div class="percentage" id="percentage"></div>
    </div>

    <p class="text">Select how many glasses of water that you have drank</p>

    <div class="cups">
      <button type="button" class="cup cup-small">250 ml</button>
      <button type="button" class="cup cup-small">250 ml</button>
      <button type="button" class="cup cup-small">250 ml</button>
      <button type="button" class="cup cup-small">250 ml</button>
      <button type="button" class="cup cup-small">250 ml</button>
      <button type="button" class="cup cup-small">250 ml</button>
      <button type="button" class="cup cup-small">250 ml</button>
      <button type="button" class="cup cup-small">250 ml</button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
