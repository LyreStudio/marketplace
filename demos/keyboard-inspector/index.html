<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    
    <link rel="stylesheet" href="dark-style.css" />
    
  <meta name="viewport" content="width=device-width, initial-scale=1"><title>Keyboard event inspector</title><meta name="lyre-marketplace-demo" content="keyboard-inspector"><link rel="stylesheet" href="lyre.css"><script src="lyre.js" type="module"></script></head>
  <body><header class="lyre-heading"><h1>Keyboard event inspector</h1><p>Inspect browser key, code and legacy keyCode fields for the focused page.</p><p>Page-local keyboard events only; no background key capture or storage.</p></header><div class="lyre-status" role="status"></div>
    <input id="mobile-key" aria-label="Type to inspect keyboard events" placeholder="Type here on a phone"><div id="insert">
      <div class="key">
        Press any key to get the keyCode
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
